[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slr-engine"
version = "1.0.0"
description = "Automated systematic literature review (SLR) engine with citation snowballing and PRISMA 2020 audit trail"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["systematic-review", "prisma", "snowballing", "literature-review", "bibliometrics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# Runtime dependencies. Version bounds are intentionally permissive here; the
# exact, reproducible lock lives in uv.lock.
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "anthropic>=0.25",
    "acl-anthology>=1.1.0",
    "matplotlib>=3.10",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
slr-engine = "slr_engine.cli:main"

[project.urls]
Homepage = "https://github.com/OWNER/slr-engine"
Documentation = "https://github.com/OWNER/slr-engine#readme"
# TODO(owner): set the real GitHub URL and add the archived Zenodo software DOI
#   (`zenodo_deposit_name`, release DOI) once the v1.0.0-mdpi tag is published.

[tool.hatch.build.targets.wheel]
packages = ["src/slr_engine"]

[tool.hatch.build.targets.sdist]
include = ["src", "configs", "schemas", "public_data", "docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
